<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="86" fill="#071026"/>
  
  <!-- Game chip/token icon -->
  <circle cx="256" cy="200" r="120" fill="url(#grad512)" stroke="#fff" stroke-width="10"/>
  
  <!-- GB text -->
  <text x="256" y="238" font-size="88" font-weight="bold" text-anchor="middle" fill="#071026" font-family="Arial, sans-serif">GB</text>
  
